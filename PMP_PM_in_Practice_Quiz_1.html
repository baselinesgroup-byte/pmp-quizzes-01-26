<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP PM in Practice Quiz 1</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            direction: ltr; /* English quiz content */
            text-align: left;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .user-info {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .user-info input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .question-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .question-title {
            font-weight: 600;
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .options-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-option {
            padding: 10px 20px;
            border: 2px solid #007bff;
            background-color: transparent;
            color: #007bff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            background-color: #007bff;
            color: white;
        }

        .btn-option.selected-true {
            background-color: #007bff;
            color: white;
        }

        .btn-option.selected-false {
            background-color: #007bff;
            color: white;
        }

        .explanation {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .explanation.correct {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid var(--success-color);
        }

        .explanation.incorrect {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border-left: 5px solid var(--error-color);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #004085;
        }

        #result-status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PMP: Project Management in Practice (Quiz 1)</h1>
    <p class="subtitle">Answer all 15 True/False scenario-based questions below.</p>

    <div class="user-info">
        <label for="username"><strong>Participant Name / Email:</strong></label>
        <input type="text" id="username" placeholder="Enter your full name or email" required>
    </div>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="submitQuiz()">Submit Quiz & Save Results</button>
    </form>

    <div id="result-status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh6IDiXSyo4Qkvcioml5hNT-UP8pENsK8QBPn2Cj7nFkAmqY0HPamMBLUIVqQCiJly/exec";

    const quizData = {
      quizName: "PMP_PM_in_Practice_Quiz_1",
      questions: [
        {
          id: 1,
          type: "tf",
          question: "Scenario: In a predictive software project, the project manager leaves the development team to completely self-organize without setting direction or making key coordination decisions. True or False: This centralized coordination model aligns with PMI standard practice for predictive environments.",
          answer: false,
          explanation: "False. Centralized coordination is led and guided by a designated project manager who sets direction, makes decisions, and coordinates work, which is ideal for predictive projects. Allowing full self-organization without guidance represents a decentralized model best suited for agile projects."
        },
        {
          id: 2,
          type: "tf",
          question: "Scenario: A organization is launching a complex transformation program. Executive leadership expects the project manager to handle all resource provisioning independently. True or False: Key organizational leadership functions include securing project funding, authority, equipment, and personnel to support delivery.",
          answer: true,
          explanation: "True. Providing resources—such as securing funding, authority, equipment, and personnel—is an essential function carried out by organizational leadership to ensure smooth project execution."
        },
        {
          id: 3,
          type: "tf",
          question: "Scenario: A newly assigned project manager believes their primary duty is solely directing team activities. True or False: According to PMI standards, project success relies on leadership roles facilitating collaboration, building consensus, and guiding teams through change.",
          answer: true,
          explanation: "True. Leadership roles drive success by encouraging collaboration, building consensus, resolving conflicts, guiding teams through change, and providing regular feedback."
        },
        {
          id: 4,
          type: "tf",
          question: "Scenario: An agile team working on a digital product features team members who fluidly assume leadership roles as needs evolve. True or False: This team structure is an example of a self-organizing, cross-functional team.",
          answer: true,
          explanation: "True. A self-organizing team is a cross-functional group in which members fluidly assume leadership as needed to achieve objectives."
        },
        {
          id: 5,
          type: "tf",
          question: "Scenario: A project manager in a construction firm adopts servant leadership by strictly dictating daily tasks and enforcing rigid top-down rules. True or False: This approach demonstrates servant leadership principles.",
          answer: false,
          explanation: "False. Servant leadership is the practice of leading by understanding and addressing the development and needs of team members to enable high performance, not by top-down dictation."
        },
        {
          id: 6,
          type: "tf",
          question: "Scenario: During resource planning, a project manager relies on a single developer who holds unique technical knowledge. True or False: Relying on a single expert for a critical task creates a single point of failure and should be mitigated by developing cross-functional skills.",
          answer: true,
          explanation: "True. Guidelines emphasize avoiding single points of failure where only one resource possesses a required skill, recommending cross-functional teams instead."
        },
        {
          id: 7,
          type: "tf",
          question: "Scenario: A project manager seeks team members who have deep expertise in one specific domain while possessing a broad set of skills across other areas. True or False: These individuals are referred to as T-shaped people or generalizing specialists.",
          answer: true,
          explanation: "True. T-shaped individuals and generalizing specialists have one core area of deep specialization combined with a broad range of general skills."
        },
        {
          id: 8,
          type: "tf",
          question: "Scenario: When building a project team, the project manager selects only deep specialists with no overlap in skills. True or False: Utilizing T-shaped people helps reduce work stoppages and resource shortages when key personnel are unavailable.",
          answer: true,
          explanation: "True. T-shaped team members provide versatility, increase organizational flexibility, and prevent work stoppages caused by resource shortages."
        },
        {
          id: 9,
          type: "tf",
          question: "Scenario: A project manager independently writes and dictates all workplace behavior rules without consulting the team. True or False: A Team Charter and ground rules should be established together with the team at the beginning of the project.",
          answer: false,
          explanation: "False. The Team Charter and ground rules should be created collaboratively with the project team to establish shared values and acceptable behavior."
        },
        {
          id: 10,
          type: "tf",
          question: "Scenario: The PMI Code of Ethics and Professional Conduct outlines core values for project practitioners. True or False: The four foundational values defined by PMI are Responsibility, Respect, Fairness, and Honesty.",
          answer: true,
          explanation: "True. The four values that drive ethical conduct in the PMI Code of Ethics are Responsibility, Respect, Fairness, and Honesty."
        },
        {
          id: 11,
          type: "tf",
          question: "Scenario: An enterprise project manager needs specialized technical guidance that is unavailable within the immediate project team. True or False: Expert judgment can only be gathered from within the internal project management team.",
          answer: false,
          explanation: "False. Expert judgment can be obtained from external sources including consultants, stakeholders, professional/technical associations, and historical data."
        },
        {
          id: 12,
          type: "tf",
          question: "Scenario: A global firm manages a project with team members located across multiple time zones. True or False: Co-location refers to a arrangement where team members work remotely using digital collaboration tools.",
          answer: false,
          explanation: "False. Co-location is an organizational strategy where team members are physically located close to one another to improve communication and productivity. Working remotely describes a virtual team setup."
        },
        {
          id: 13,
          type: "tf",
          question: "Scenario: A project manager leads a fully virtual software delivery team. True or False: To ensure cohesion, the project manager must establish clear purpose, role clarity, shared goals, and prioritized collaboration.",
          answer: true,
          explanation: "True. Addressing virtual team needs requires fostering cohesion, defining clear roles and purpose, aligning shared goals, and ensuring collaboration."
        },
        {
          id: 14,
          type: "tf",
          question: "Scenario: During team formation, a project manager conducts a SWOT analysis. True or False: Conducting a SWOT analysis helps identify team strengths, weaknesses, threats, and opportunities to improve overall performance.",
          answer: true,
          explanation: "True. Focusing on team strengths involves organizing around capabilities, recognizing weaknesses, and using SWOT analysis to identify opportunities and threats."
        },
        {
          id: 15,
          type: "tf",
          question: "Scenario: In a hybrid project environment, communication channels are established at launch. True or False: Project managers should regularly check and evaluate communication mechanisms through retrospectives to ensure ongoing alignment.",
          answer: true,
          explanation: "True. Project managers should check communications regularly and use retrospectives to discuss and implement ongoing communication improvements."
        }
      ]
    };

    const userAnswers = {};

    function renderQuiz() {
        const container = document.getElementById('questions-container');
        quizData.questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-title">${index + 1}.${q.question}</div>
                <div class="options-group">
                    <button type="button" class="btn-option" id="btn-${q.id}-true" onclick="selectAnswer(${q.id}, true)">True</button>
                    <button type="button" class="btn-option" id="btn-${q.id}-false" onclick="selectAnswer(${q.id}, false)">False</button>
                </div>
                <div id="exp-${q.id}" class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>
            `;
            container.appendChild(card);
        });
    }

    function selectAnswer(questionId, value) {
        userAnswers[questionId] = value;
        
        const btnTrue = document.getElementById(`btn-${questionId}-true`);
        const btnFalse = document.getElementById(`btn-${questionId}-false`);

        if(value === true) {
            btnTrue.classList.add('selected-true');
            btnFalse.classList.remove('selected-false');
        } else {
            btnFalse.classList.add('selected-false');
            btnTrue.classList.remove('selected-true');
        }
    }

    function submitQuiz() {
        const username = document.getElementById('username').value.trim();
        if(!username) {
            alert('Please enter your name or email before submitting.');
            return;
        }

        if(Object.keys(userAnswers).length < quizData.questions.length) {
            alert('Please answer all questions before submitting.');
            return;
        }

        let score = 0;
        quizData.questions.forEach(q => {
            const isCorrect = userAnswers[q.id] === q.answer;
            if(isCorrect) score++;

            const expDiv = document.getElementById(`exp-${q.id}`);
            expDiv.className = `explanation ${isCorrect ? 'correct' : 'incorrect'}`;
        });

        const scorePercentage = ((score / quizData.questions.length) * 100).toFixed(1);
        const statusDiv = document.getElementById('result-status');
        statusDiv.style.color = '#0056b3';
        statusDiv.innerHTML = `Your Score: ${score} / ${quizData.questions.length} (${scorePercentage}%)<br>Submitting results to Google Sheets...`;

        // Payload for Google Apps Script
        const payload = {
            quizName: quizData.quizName,
            userName: username,
            score: score,
            totalQuestions: quizData.questions.length,
            percentage: scorePercentage,
            answers: userAnswers,
            submittedAt: new Date().toISOString()
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(() => {
            statusDiv.style.color = 'green';
            statusDiv.innerHTML = `Your Score: ${score} / ${quizData.questions.length} (${scorePercentage}%)<br>✓ Results successfully submitted!`;
        }).catch(err => {
            console.error('Error submitting results:', err);
            statusDiv.style.color = 'red';
            statusDiv.innerHTML = `Your Score: ${score} /${quizData.questions.
